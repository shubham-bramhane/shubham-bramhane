<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-label="Shubham Bramhane Footer">
  <defs>
    
    <linearGradient id="ftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F8FE"/>
    </linearGradient>
    <linearGradient id="ftSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ftArcticBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="48%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect x="4" y="4" width="992" height="68" rx="16"/>
    </clipPath>
    <linearGradient id="footWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="footWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.16"/>
    </linearGradient>
    <style>
      @keyframes footShimmer { 0% { transform: translateX(-220px); opacity: 0; } 25% { opacity: 0.78; } 75% { opacity: 0.78; } 100% { transform: translateX(1020px); opacity: 0; } }
      .shimmer { animation: footShimmer 6s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#footClip)">
    <rect x="4" y="4" width="992" height="68" fill="url(#ftCard)"/>
    <path d="M0 52 Q250 20 500 46 T1000 34 L1000 76 L0 76 Z" fill="url(#footWave1)"/>
    <path d="M0 40 Q280 64 560 32 T1000 50 L1000 76 L0 76 Z" fill="url(#footWave2)"/>
    <rect x="4" y="69" width="992" height="3" fill="url(#ftArcticBar)"/>
    <rect x="0" y="69" width="180" height="3" fill="#FFFFFF" class="shimmer"/>
  </g>
  <rect x="4" y="4" width="992" height="68" rx="16" fill="none" stroke="#D8E4F2" stroke-width="1.2"/>
  <line x1="22" y1="4.8" x2="978" y2="4.8" stroke="url(#ftSpec)" stroke-width="1"/>
  <text x="500" y="43" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" letter-spacing="1.0" fill="#44556E">&lt;SB/&gt;  SHUBHAM BRAMHANE  ·  ARCHITECTING HIGH-THROUGHPUT SYSTEMS WITH AI VELOCITY</text>
</svg>
