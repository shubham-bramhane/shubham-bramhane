<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-label="Career Experience and Academic Credentials">
  <defs>
    
    <linearGradient id="jrCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161024"/>
      <stop offset="100%" stop-color="#0B0814"/>
    </linearGradient>
    <linearGradient id="jrSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD6EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD6EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD6EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jrViceBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D94"/>
      <stop offset="50%" stop-color="#FFC457"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FF4D94"/>
      <stop offset="100%" stop-color="#FFC457"/>
    </linearGradient>
    <style>
      @keyframes pulseNode { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .live-dot { animation: pulseNode 2.2s ease-in-out infinite; }
    </style>
  </defs>

  
