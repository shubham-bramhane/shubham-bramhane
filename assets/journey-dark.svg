    <text x="23" y="18.5" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.4" font-weight="700" letter-spacing="1.9" fill="#C4B5D4">CAREER JOURNEY &amp; CREDENTIALS</text>
