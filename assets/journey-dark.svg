<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-label="Career Experience and Academic Credentials">
  <defs>
    
    <linearGradient id="jrCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111A29"/>
      <stop offset="100%" stop-color="#090E18"/>
    </linearGradient>
    <linearGradient id="jrSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jrArcticBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="48%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <style>
      @keyframes pulseNode { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .live-dot { animation: pulseNode 2.2s ease-in-out infinite; }
    </style>
  </defs>

  
