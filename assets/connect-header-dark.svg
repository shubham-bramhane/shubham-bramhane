<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Initiate Contact and Connect">
  <defs>
    
    <linearGradient id="cnCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151929"/>
      <stop offset="100%" stop-color="#0B0D15"/>
    </linearGradient>
    <linearGradient id="cnSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="connectGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  
  <g>
    <rect x="6" y="9" width="9" height="9" rx="3" fill="#FB923C"/>
    <circle cx="10.5" cy="13.5" r="1.8" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="23" y="18.5" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#A8B1CC">INITIATE CONTACT &amp; CONNECT</text>
    <line x1="256" y1="14" x2="735" y2="14" stroke="#202742" stroke-width="1"/>
    <text x="994" y="18.5" text-anchor="end" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.1" fill="#6E7899">OPEN FOR ROLES, ARCHITECTURE &amp; ADVISORY</text>
  </g>
  <rect x="4" y="35" width="992" height="49" rx="14" fill="url(#cnCard)" stroke="#242A45" stroke-width="1.2"/>
  <rect x="4" y="35" width="5" height="49" rx="2.5" fill="url(#connectGrad)"/>
  <line x1="20" y1="35.8" x2="980" y2="35.8" stroke="url(#cnSpec)" stroke-width="1"/>
  <text x="26" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Explore my live Next.js portfolio, download my resume, or connect directly across channels below.</text>
</svg>
