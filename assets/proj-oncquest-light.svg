    </radialGradient>
    <clipPath id="prClip"><rect x="2" y="2" width="484" height="158" rx="16"/></clipPath>
    <style>
      @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .lp { animation: livePulse 2.2s ease-in-out infinite; }
    </style>
