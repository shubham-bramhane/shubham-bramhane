      <stop offset="100%" stop-color="#FFF6FA"/>
    </linearGradient>
    <linearGradient id="jrSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jrViceBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <style>
      @keyframes pulseNode { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .live-dot { animation: pulseNode 2.2s ease-in-out infinite; }
    </style>
  </defs>

  
