    <text x="54" y="244" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.4" fill="#7C6B94">▸ High-concurrency relational DB schemas with optimized query execution</text>
