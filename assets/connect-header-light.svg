<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Initiate Contact and Connect">
  <defs>
    
    <linearGradient id="cnCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF6FA"/>
    </linearGradient>
    <linearGradient id="cnSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cnViceBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  
  <g>
    <rect x="6" y="9" width="9" height="9" rx="2.8" fill="#EA580C"/>
    <circle cx="10.5" cy="13.5" r="1.8" fill="#FFFFFF" fill-opacity="0.8"/>
    <text x="23" y="18.5" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.4" font-weight="700" letter-spacing="1.9" fill="#53426B">INITIATE CONTACT &amp; CONNECT</text>
    <line x1="256" y1="13.8" x2="735" y2="13.8" stroke="#ECDEE8" stroke-width="1"/>
    <text x="994" y="18.5" text-anchor="end" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.0" fill="#7C6B94">OPEN FOR ROLES, ARCHITECTURE &amp; ADVISORY</text>
  </g>
  <rect x="4" y="35" width="992" height="49" rx="14" fill="url(#cnCard)" stroke="#EADAE5" stroke-width="1.2"/>
  <rect x="4" y="35" width="5" height="49" rx="2.5" fill="url(#cnViceBar)"/>
  <line x1="20" y1="35.8" x2="980" y2="35.8" stroke="url(#cnSpec)" stroke-width="1"/>
  <text x="26" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#180E29">Explore my live portfolio, download my resume, or connect directly across channels below.</text>
