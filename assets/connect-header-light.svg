<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Initiate Contact and Connect">
  <defs>
    
    <linearGradient id="cnCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F6F2EA"/>
    </linearGradient>
    <linearGradient id="cnSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cnGoldFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5518"/>
      <stop offset="35%" stop-color="#B88735"/>
      <stop offset="68%" stop-color="#9A6E24"/>
      <stop offset="100%" stop-color="#7A5518"/>
    </linearGradient>
  </defs>
  
  <g>
    <polygon points="10.5,8.5 15.5,13.5 10.5,18.5 5.5,13.5" fill="#9A6E24"/>
    <text x="24" y="18.5" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.4" font-weight="700" letter-spacing="2.0" fill="#524B42">INITIATE CONTACT &amp; CONNECT</text>
    <line x1="256" y1="13.8" x2="735" y2="13.8" stroke="#E6DFD3" stroke-width="1"/>
    <text x="994" y="18.5" text-anchor="end" font-family="'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.0" fill="#7D756A">OPEN FOR ROLES, ARCHITECTURE &amp; ADVISORY</text>
  </g>
  <rect x="4" y="35" width="992" height="49" rx="14" fill="url(#cnCard)" stroke="#E5DDD0" stroke-width="1.2"/>
  <rect x="4" y="35" width="5" height="49" rx="2.5" fill="url(#cnGoldFoil)"/>
  <line x1="20" y1="35.8" x2="980" y2="35.8" stroke="url(#cnSpec)" stroke-width="1"/>
  <text x="26" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#181512">Explore my live portfolio, download my resume, or connect directly across channels below.</text>
</svg>
