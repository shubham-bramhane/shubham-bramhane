<svg xmlns="http://www.w3.org/2000/svg" width="488" height="162" viewBox="0 0 488 162" role="img" aria-label="Next-Gen Portfolio &amp; Hotel POS">
  <defs>
    
    <linearGradient id="prCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F8FE"/>
    </linearGradient>
    <linearGradient id="prSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prArcticBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="48%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="prGlow" cx="92%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="prClip"><rect x="2" y="2" width="484" height="158" rx="16"/></clipPath>
    <style>
      @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .lp { animation: livePulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#prClip)">
    <rect x="2" y="2" width="484" height="158" fill="url(#prCard)"/>
    <rect x="2" y="2" width="484" height="158" fill="url(#prGlow)"/>
  </g>
  <rect x="2" y="2" width="484" height="158" rx="16" fill="none" stroke="#D8E4F2" stroke-width="1.15"/>
  <line x1="20" y1="2.8" x2="468" y2="2.8" stroke="url(#prSpec)" stroke-width="1"/>
  <rect x="20" y="2" width="58" height="2.8" rx="1.4" fill="#334155"/>

